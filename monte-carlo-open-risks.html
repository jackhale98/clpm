<!DOCTYPE html>
<html>
<head>
  <title>Active Risks</title>
  <style>
    table { border-collapse: collapse; width: 100%%; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #4CAF50; color: white; }
    tr:nth-child(even) { background-color: #f2f2f2; }
    .critical { background-color: #ffebee; }
    .high { background-color: #fff3e0; }
  </style>
</head>
<body>
<h1>Active Risks</h1>
<table>
<tr>
  <th>Name</th>
  <th>Probability</th>
  <th>Impact</th>
  <th>Score</th>
  <th>Mitigation</th>
</tr>
<tr class="high">
  <td>Scope Creep</td>
  <td>40.%</td>
  <td>80.%</td>
  <td>32.%</td>
  <td></td>
</tr>
<tr>
  <td>Critical Defects Found</td>
  <td>25.%</td>
  <td>80.%</td>
  <td>20.%</td>
  <td></td>
</tr>
<tr>
  <td>Integration Complexity</td>
  <td>30.%</td>
  <td>50.%</td>
  <td>15.%</td>
  <td></td>
</tr>
</table>
</body>
</html>
